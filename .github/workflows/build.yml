name: Build and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x64
            runner: ubuntu-latest
            gradle_task: :lwjgl3:packageLinuxX64
            artifact_name: TwinBee-linux-x64
          - platform: Windows x64
            runner: windows-latest
            gradle_task: :lwjgl3:packageWinX64
            artifact_name: TwinBee-windows-x64
          - platform: macOS Intel
            runner: macos-15-intel
            gradle_task: :lwjgl3:packageMacX64
            artifact_name: TwinBee-macos-x64
          - platform: macOS Apple Silicon
            runner: macos-15
            gradle_task: :lwjgl3:packageMacM1
            artifact_name: TwinBee-macos-arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build platform package
        shell: bash
        run: bash ./gradlew --no-daemon "${{ matrix.gradle_task }}"
      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: lwjgl3/build/construo/dist/*.zip
          if-no-files-found: error
          compression-level: 0
  all-platforms:
    name: Combine platform packages
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: TwinBee-*
          path: platform-artifacts
          merge-multiple: true
      - name: Upload combined package
        uses: actions/upload-artifact@v4
        with:
          name: TwinBee-all-platforms
          path: platform-artifacts/*.zip
          if-no-files-found: error
          compression-level: 0
